<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Tài Chính Pro - Meow Garden</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffc107">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meow Garden">

    <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=19hEUw1Xuzx0m42WPttoLY84DvvgUUG-0">
    <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=19hEUw1Xuzx0m42WPttoLY84DvvgUUG-0">

    <style>
        /* Xóa bỏ mọi khoảng trắng mặc định */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #f8f9fa; 
        }

        /* Khung chứa ứng dụng toàn màn hình tuyệt đối */
        .app-container {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Tối ưu hóa Iframe nhúng từ GAS */
        iframe { 
            flex-grow: 1;
            width: 100%; 
            height: 100%; 
            border: none;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw8hCFA8B2U9j4seHAUVWGec7xUB1HsTdrd468vQsHPknKW5l8UTy5lq9LwZEpFag/exec"
            allow="clipboard-read; clipboard-write; geolocation"
            title="Quản Lý Tài Chính Pro">
        </iframe>
    </div>

    <script>
        // ĐĂNG KÝ SERVICE WORKER ĐỂ ẨN THANH ĐỊA CHỈ
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log("SW OK!"))
            .catch((err) => console.log("SW Lỗi: ", err));
        }

        // 2. BẪY LỊCH SỬ CHỐN NÚT BACK
        (function() {
            history.pushState(null, document.title, location.href);
            window.addEventListener('popstate', function (event) {
                history.pushState(null, document.title, location.href);
            });
        })();
    </script>
</body>
</html>
