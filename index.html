<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Tài Chính</title>
    
    <link rel="manifest" href="https://toanthien121314-sys.github.io/TC/manifest.json">
    <meta name="theme-color" content="#f8f9fa">
    
    <link rel="apple-touch-icon" href="https://toanthien121314-sys.github.io/TC/icon.png">
    <link rel="icon" type="image/png" href="https://toanthien121314-sys.github.io/TC/icon.png">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f8f9fa; /* Trả lại màu xám nhạt */
        }
        
        .app-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #f8f9fa; 
            /* QUAN TRỌNG: Lệnh này sẽ như một cái kéo, cắt bỏ mọi thứ của iframe bị đẩy ra ngoài */
            overflow: hidden; 
        }
        
        iframe { 
            position: absolute;
            /* THỦ THUẬT: Đẩy mạnh iframe lên trên 15 pixel để giấu hẳn cái bóng mờ của Google Apps Script */
            top: -15px; 
            left: 0;
            width: 100%; 
            /* Bù lại 15 pixel ở dưới đáy để app không bị hụt lên trên */
            height: calc(100% + 15px); 
            border: none; 
            display: block;
        }
        
        #install-btn {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #fff;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 9999;
            cursor: pointer;
        }
        /* Thêm đoạn này vào dưới cùng của thẻ <style> */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f8f9fa; /* Màu nền tệp với app */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50; /* Nổi lên trên cùng */
            transition: opacity 0.5s ease;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .loading-logo {
            width: 100px; /* Kích thước logo */
            animation: pulse 1.5s infinite ease-in-out;
            border-radius: 20px;
        }
        
        .loading-text {
            margin-top: 20px;
            font-family: sans-serif;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="app-container">
        <div id="loading-screen">
            <img src="https://toanthien121314-sys.github.io/TC/icon.png" class="loading-logo" alt="Loading">
            <div class="loading-text">Đang đồng bộ dữ liệu...</div>
        </div>

        <iframe src="https://script.google.com/macros/s/AKfycbyztSekLVQFap78nMgqZkToYMDZlxUJERMQ-Q8shtk8qZ_aLd78yr-dG006FMGayg/exec" onload="document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);"></iframe>
    </div>
    
    <button id="install-btn">CÀI ĐẶT APP MEOW GARDEN</button>

    <script>
        // 1. ĐĂNG KÝ SERVICE WORKER BẰNG LINK TUYỆT ĐỐI
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('https://toanthien121314-sys.github.io/TC/sw.js')
            .then(() => console.log("SW OK"));
        }

        // 2. ÉP HIỆN NÚT CÀI ĐẶT TỰ ĐỘNG
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });

        // 3. BẪY LỊCH SỬ
        (function() {
            history.pushState(null, document.title, location.href);
            window.addEventListener('popstate', function (event) {
                history.pushState(null, document.title, location.href);
            });
        })();
    </script>
</body>
</html>
