<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Tài Chính</title>
    
    <link rel="manifest" href="https://toanthien121314-sys.github.io/TC/manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meow Fin">
    
    <link rel="apple-touch-icon" href="https://toanthien121314-sys.github.io/TC/icon.png">
    <link rel="icon" type="image/png" href="https://toanthien121314-sys.github.io/TC/icon.png">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            /* Ép màu nền trắng tinh để liền mạch với app GAS */
            background-color: #ffffff; 
        }
        
        .app-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            box-sizing: border-box;
            background-color: #ffffff; 
        }
        
        iframe { 
            flex-grow: 1; 
            width: 100%; 
            height: 100%; 
            border: none; 
            /* Thêm display block để triệt tiêu khoảng trống ngầm dưới đáy iframe */
            display: block; 
            background-color: #ffffff; 
        }
        
        #install-btn {
            display: none;
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #fff;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <iframe src="https://script.google.com/macros/s/AKfycbw8hCFA8B2U9j4seHAUVWGec7xUB1HsTdrd468vQsHPknKW5l8UTy5lq9LwZEpFag/exec"></iframe>
    </div>
    
    <button id="install-btn">CÀI ĐẶT APP MEOW GARDEN</button>

    <script>
        // 1. ĐĂNG KÝ SERVICE WORKER BẰNG LINK TUYỆT ĐỐI
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('https://toanthien121314-sys.github.io/TC/sw.js')
            .then(() => console.log("SW OK"));
        }

        // 2. ÉP HIỆN NÚT CÀI ĐẶT TỰ ĐỘNG
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });

        // 3. BẪY LỊCH SỬ
        (function() {
            history.pushState(null, document.title, location.href);
            window.addEventListener('popstate', function (event) {
                history.pushState(null, document.title, location.href);
            });
        })();
    </script>
</body>
</html>
