<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Tài Chính</title>
    
    <link rel="manifest" href="https://toanthien121314-sys.github.io/TC/manifest.json">
    <meta name="theme-color" content="#ffc107">
    
    <link rel="apple-touch-icon" href="https://toanthien121314-sys.github.io/TC/icon.png">
    <link rel="icon" type="image/png" href="https://toanthien121314-sys.github.io/TC/icon.png">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8f9fa; }
        .app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
        iframe { flex-grow: 1; width: 100%; height: 100%; border: none; }
        
        /* Nút cài đặt ma thuật */
        #install-btn {
            display: none; /* Ẩn mặc định, chỉ hiện khi Chrome cho phép */
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #fff;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <iframe src="https://script.google.com/macros/s/AKfycbw8hCFA8B2U9j4seHAUVWGec7xUB1HsTdrd468vQsHPknKW5l8UTy5lq9LwZEpFag/exec"></iframe>
    </div>
    
    <button id="install-btn">CÀI ĐẶT APP MEOW GARDEN</button>

    <script>
        // 1. ĐĂNG KÝ SERVICE WORKER BẰNG LINK TUYỆT ĐỐI
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('https://toanthien121314-sys.github.io/TC/sw.js')
            .then(() => console.log("SW OK"));
        }

        // 2. ÉP HIỆN NÚT CÀI ĐẶT TỰ ĐỘNG
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Ngăn Chrome tự hiện popup mặc định (để tự mình kiểm soát)
            e.preventDefault();
            deferredPrompt = e;
            // Cho hiện nút màu vàng lên!
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            installBtn.style.display = 'none'; // Ẩn nút đi
            deferredPrompt.prompt(); // Mở bảng cài đặt của điện thoại
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        });

        // 3. BẪY LỊCH SỬ
        (function() {
            history.pushState(null, document.title, location.href);
            window.addEventListener('popstate', function (event) {
                history.pushState(null, document.title, location.href);
            });
        })();
    </script>
</body>
</html>
